name: Release

# Builds the Windows programs on GitHub's own machines from the exact source, runs the tests, and publishes a
# release with the programs, their SHA-256 checksums and a signed build-provenance attestation (so anyone can
# verify the files came from this repository).
#   - Actions tab > Release > "Run workflow", type a version such as v1.0.0: creates the tag and the release.
#   - Or push a tag (v*), or publish a release by hand in the web page: the programs are attached to it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to release, for example v1.0.0'
        required: true
  push:
    tags: ['v*']
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip

      - name: Unit tests
        run: make test

      - name: Build
        run: |
          make all
          mkdir release
          cp Mouthpiece.exe MouthpieceCLI.exe MouthpieceVoiceHost32.exe release/
          (cd release && zip -q Mouthpiece-win64.zip Mouthpiece.exe MouthpieceCLI.exe MouthpieceVoiceHost32.exe && sha256sum *.exe *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'release/*'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          { cat .github/release-notes.md; echo; echo '### Check your download (SHA-256)'; echo '```'; cat release/SHA256SUMS.txt; echo '```'; echo "In PowerShell: \`Get-FileHash .\\Mouthpiece-win64.zip\`. Built by GitHub Actions from this commit; verify with \`gh attestation verify Mouthpiece-win64.zip --repo ${{ github.repository }}\`."; } > body.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --notes-file body.md
          else
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "Mouthpiece ${TAG#v}" --notes-file body.md
          fi
